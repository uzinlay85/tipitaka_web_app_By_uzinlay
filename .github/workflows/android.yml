name: Android APK release

# Tag like `android-v1.0.0` -> builds the APK and publishes a GitHub Release.
# Usage:
#   git tag android-v1.0.0
#   git push origin android-v1.0.0
# (APK is debug-signed: fine for sideloading via GitHub Releases.)

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#android-v}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon -x lint
        env:
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.name }}
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             "tipitaka-android-v${{ steps.ver.outputs.name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/tipitaka-android-v${{ steps.ver.outputs.name }}.apk
          generate_release_notes: false
          body: |
            တိပိဋက Android app v${{ steps.ver.outputs.name }} (early release)

            **ထည့်သွင်းနည်း**
            1. APK ကို ဒေါင်းလုဒ်ဆွဲပြီး install လုပ်ပါ (unknown sources ခွင့်ပြုရမယ်)
            2. ပထမအကြိမ်ဖွင့်ရင် ကျမ်းစာဒေတာဘေ့စ် ~150MB ဒေါင်းလုဒ်ဆွဲမယ် — WiFi နဲ့ လုပ်ပါ
            3. ပြီးရင် offline မှာ အကုန်သုံးလို့ရပြီ

            **ပါဝင်မှုများ**
            - Web version feature အကုန် (စာဖတ် ၃ မျိုး, အဘိဓာန်, ရှာဖွေမှု, မှတ်တမ်း, စာမှတ်, annotation, Word export, theme)
            - Online ဆို VPS နဲ့ sync (bookmark/history/annotation စက်အချင်းချင်း)
            - Offline ဆို device ပေါ်မှာ အကုန်အလုပ်လုပ်

            ⚠️ Early release: debug-signed APK ဖြစ်လို့ Play Store မဟုတ်ဘဲ ဒီကနေ တိုက်ရိုက်သွင်းရတာပါ။
