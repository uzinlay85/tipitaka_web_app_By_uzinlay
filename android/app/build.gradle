plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("com.chaquo.python")
}

def verName = System.getenv("ANDROID_VERSION_NAME")
    ?: (project.findProperty("ANDROID_VERSION_NAME") ?: "1.0.5")
def verCode = (System.getenv("ANDROID_VERSION_CODE")
    ?: (project.findProperty("ANDROID_VERSION_CODE") ?: "6")).toInteger()

android {
    namespace = "top.upanna.tipitaka"
    compileSdk = 34

    defaultConfig {
        applicationId = "top.upanna.tipitaka"
        minSdk = 24
        targetSdk = 34
        versionCode = verCode
        versionName = verName
        // Only 64-bit ABIs: every Android phone shipped in the last ~8 years.
        // (x86_64 kept so the app also runs on emulators.)
        // NOTE: Python 3.12+ supports 64-bit ABIs only.
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        create("release") {
            def keystorePropsFile = rootProject.file("release-keystore.properties")
            def appKeystorePropsFile = file("release-keystore.properties")
            def propsFile = keystorePropsFile.exists() ? keystorePropsFile : (appKeystorePropsFile.exists() ? appKeystorePropsFile : null)

            if (propsFile != null && propsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                def storeFilePath = props['RELEASE_STORE_FILE'] ?: "tipitaka-release.jks"
                def resolvedFile = file(storeFilePath)
                if (!resolvedFile.exists()) {
                    resolvedFile = rootProject.file(storeFilePath)
                }
                storeFile = resolvedFile
                storePassword = props['RELEASE_STORE_PASSWORD']
                keyAlias = props['RELEASE_KEY_ALIAS']
                keyPassword = props['RELEASE_KEY_PASSWORD']
            } else if (System.getenv("RELEASE_STORE_FILE") != null) {
                storeFile = file(System.getenv("RELEASE_STORE_FILE"))
                storePassword = System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias = System.getenv("RELEASE_KEY_ALIAS")
                keyPassword = System.getenv("RELEASE_KEY_PASSWORD")
            } else {
                // Graceful fallback to debug signing when release keystore is not yet generated
                storeFile = signingConfigs.getByName("debug").storeFile
                storePassword = signingConfigs.getByName("debug").storePassword
                keyAlias = signingConfigs.getByName("debug").keyAlias
                keyPassword = signingConfigs.getByName("debug").keyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Debug-signed APK: fine for local development.
        }
        release {
            signingConfig = signingConfigs.getByName("release")
            minifyEnabled = false
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("androidx.core:core-ktx:1.13.1")
}

chaquopy {
    defaultConfig {
        version = "3.12"
        pip {
            // Same server deps as requirements.txt (minus weasyprint).
            install("flask>=3.0.0")
            install("python-docx>=1.1.0")
        }
    }
    sourceSets {
        // build/generated/tipitaka_py <- synced from repo root by syncTipitakaPy
        getByName("main").srcDir(layout.buildDirectory.dir("generated/tipitaka_py"))
    }
}

// ---- Single source of truth: copy the web app's Python + assets ----
// app.py, export_doc.py, static/ and templates/ live in the repo root and are
// synced into the Chaquopy source dir before every Python-related task.
def syncTipitakaPy = tasks.register("syncTipitakaPy", Sync) {
    from("${rootProject.projectDir}/../app.py")
    from("${rootProject.projectDir}/../export_doc.py")
    from("${rootProject.projectDir}/../static") { into("static") }
    from("${rootProject.projectDir}/../templates") { into("templates") }
    into(layout.buildDirectory.dir("generated/tipitaka_py"))
}

// Chaquopy's merge*PythonSources tasks consume build/generated/tipitaka_py
// (registered as a Python source dir above). Declare the producer explicitly:
// without this, Gradle 8 fails with an implicit-dependency validation error.
afterEvaluate {
    tasks.matching { it.name ==~ /merge.+PythonSources/ }.configureEach {
        dependsOn(syncTipitakaPy)
    }
}
